name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the scripted drive and command-line flags if relevant (e.g. `highway-cruise --stage COMPASS`).
    validations:
      required: true
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle source
      options:
        - Synthetic truck
        - Real vehicle (say which adapter below)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build / commit, device and Windows version
      placeholder: "develop @ abc1234, Surface Pro 7, Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove any location, VIN or other personal data first.
